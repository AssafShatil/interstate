<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interstate Male</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
  [hidden] { display: none !important; }
  /* Single-look design: Interstate is pure black by identity, in any host theme. */
  :root {
    color-scheme: dark;
    --black: #000000;
    --turq: #2EE6D6;       /* 01 */
    --blue: #4A7BFF;       /* 02 */
    --violet: #9D5CFF;     /* 03 */
    --label: #8A8DB0;      /* lavender grey */
    --faint: #15142A;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; background: var(--black); }
  body { background: radial-gradient(120% 70% at 50% 42%, #0B0920 0%, #05040E 45%, #000 80%) var(--black); }
  /* LAMP — the screen becomes a warm, low light that breathes with the session */
  #lamp { position: fixed; inset: -10%; pointer-events: none; opacity: 0; will-change: opacity, transform; }
  body.lamp .wordmark, body.lamp .edition, body.lamp .hint, body.lamp .weekly { opacity: 0.25; }
  body.lamp #dial { opacity: 0.4; transition: opacity 2s ease; }
  body.lamp #dial:active { opacity: 0.9; }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .app { position: relative; }
  body {
    margin: 0;
    color: var(--label);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding-inline: 16px;
    padding-block: 52px 20px;
    gap: 8px;
  }
  .wordmark {
    margin: 0;
    font-weight: 300; font-size: 13px;
    letter-spacing: 0.6em; padding-left: 0.6em;   /* optically centre the tracked word */
    color: var(--label);
  }
  .stage {
    flex: 1 1 auto; min-height: 0; width: 100%;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; max-width: 100%; transform: translateY(-38px); }   /* ≈ 1 cm up */
  canvas:focus-visible { outline: 1px solid var(--label); outline-offset: 4px; border-radius: 50%; }

  .edition { margin: 4px 0 0; font-size: 9px; letter-spacing: 0.5em; padding-left: 0.5em; color: #9D5CFF; opacity: 0.8; }
  body.rest .edition { opacity: 0; }
  .wordmark, .hint, .hud, .sess, .end, .edition { transition: opacity 1.2s ease; }
  body.rest .sess, body.rest .end { opacity: 0; }
  .sess { margin: 6px 0 0; min-height: 14px; font-size: 10px; letter-spacing: 0.22em; padding-left: 0.22em; font-variant-numeric: tabular-nums; }
  .sess-ctl { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  body.rest .sess-ctl { opacity: 0; }
  .sess-ctl { transition: opacity 1.2s ease; }
  .end { margin-top: 4px; background: none; border: 0; color: var(--label); opacity: 0.7; font: 400 10px var(--mono);
         letter-spacing: 0.18em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .end:focus-visible, .intent:focus-visible, .len:focus-visible, .begin:focus-visible { outline: 1px solid var(--label); outline-offset: 3px; }
  /* HOME — choose an intent and a length */
  .home { position: fixed; inset: 0; z-index: 5; box-sizing: border-box; overflow-y: auto;
          display: flex; flex-direction: column; align-items: center; gap: 22px;
          padding-inline: 24px; padding-block: 52px 28px;
          background: radial-gradient(120% 70% at 50% 42%, #0B0920 0%, #05040E 45%, #000 80%) #000;
          transition: opacity 0.9s ease; }
  .home.hidden { opacity: 0; pointer-events: none; }
  .intents { width: 100%; max-width: 360px; display: grid; gap: 4px; margin-top: 8vh; }
  .intent { display: grid; grid-template-columns: 1fr; text-align: left; gap: 3px; cursor: pointer;
            background: none; border: 0; border-left: 1px solid transparent; color: var(--label);
            padding: 12px 14px; font-family: var(--mono); transition: border-color .3s, color .3s, background .3s; }
  .intent .in-name { font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; }
  .intent .in-line { font-size: 10px; letter-spacing: 0.08em; opacity: 0.7; }
  .intent[aria-checked="true"] { color: var(--c); border-left-color: var(--c);
            background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, transparent), transparent 70%); }
  .intent[aria-checked="true"] .in-name { text-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent); }
  .lengths { display: flex; align-items: baseline; gap: 6px; }
  .len { background: none; border: 1px solid transparent; border-radius: 999px; color: var(--label); cursor: pointer;
         font: 500 13px var(--mono); padding: 6px 12px; font-variant-numeric: tabular-nums; }
  .len[aria-checked="true"] { border-color: color-mix(in srgb, var(--label) 60%, transparent); color: #D8DAF0; }
  .len-unit { font-size: 10px; letter-spacing: 0.14em; margin-left: 2px; }
  .begin { margin-top: 6px; background: none; color: #E9E6FF; cursor: pointer; font: 500 12px var(--mono);
           letter-spacing: 0.4em; padding: 14px 34px 14px calc(34px + 0.4em); text-transform: uppercase;
           border: 1px solid color-mix(in srgb, #9D5CFF 55%, transparent); border-radius: 999px;
           box-shadow: 0 0 22px color-mix(in srgb, #9D5CFF 22%, transparent), inset 0 0 14px color-mix(in srgb, #4A7BFF 12%, transparent); }
  .weekly { margin: 4px 0 0; opacity: 0.7;  }
  .weekly, .home-hint { margin: 0; font-size: 10px; letter-spacing: 0.14em; text-align: center; min-height: 14px; }
  .home-hint { margin-top: auto; opacity: 0.6; }
  body.rest .wordmark, body.rest .hint { opacity: 0; }
  .hud { height: 44px; display: grid; justify-items: center; align-content: center; gap: 4px; opacity: 0; }
  .hud.show { opacity: 1; transition: opacity 0.15s ease; }
  .hud-name { font-size: 10px; letter-spacing: 0.28em; padding-left: 0.28em; }
  .hud-val { font-size: 18px; font-weight: 500; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; min-height: 16px; font-size: 10px; letter-spacing: 0.14em; text-align: center; }
  .readouts {
    width: 100%; max-width: 420px;
    display: grid; gap: 12px;
  }
  .row { display: grid; grid-template-columns: 2px 1fr auto; column-gap: 10px; align-items: baseline; }
  .row .bar { align-self: stretch; border-radius: 1px; }
  .row .name { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .row .cap { font-size: 9px; letter-spacing: 0.06em; opacity: 0.75; margin-top: 3px; }
  .row .val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .outer .bar { background: var(--turq); box-shadow: 0 0 8px var(--turq); }     .outer .val { color: var(--turq); text-shadow: 0 0 10px rgba(46,230,214,.45); }
  .middle .bar { background: var(--blue); box-shadow: 0 0 8px var(--blue); }     .middle .val { color: var(--blue); text-shadow: 0 0 10px rgba(74,123,255,.45); }
  .core .bar { background: var(--violet); box-shadow: 0 0 8px var(--violet); }   .core .val { color: var(--violet); text-shadow: 0 0 10px rgba(157,92,255,.45); }

  .status {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 9px; letter-spacing: 0.08em; padding-top: 4px;
  }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--label); margin-right: 8px; vertical-align: middle; }
  .dot.on { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .note { font-size: 9px; letter-spacing: 0.04em; opacity: 0.6; text-align: center; max-width: 420px; line-height: 1.5; margin: 0; }
  .err { color: var(--violet); }
  /* SETTINGS + JOURNAL — a quiet page, text only */
  .prefs-btn { opacity: 0.45; font-size: 9px; padding: 6px 12px; margin-top: 0; }
  .prefs { position: fixed; inset: 0; z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch;
           background: #000; color: var(--label); font-family: var(--mono); box-sizing: border-box;
           padding: 28px 16px 60px; -webkit-user-select: none; user-select: none; }
  .prefs-in { max-width: 460px; margin: 0 auto; }
  .p-top { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .p-tabs { display: flex; gap: 2px; }
  .p-tab, .p-act { background: none; border: 0; color: var(--label); font: 500 10px var(--mono); letter-spacing: 0.2em;
           text-transform: uppercase; padding: 8px 10px; cursor: pointer; opacity: 0.55; }
  .p-tab[aria-selected="true"] { opacity: 1; color: #E9E6FF; }
  .p-act { opacity: 0.8; }
  .p-note { font-size: 9px; letter-spacing: 0.08em; opacity: 0.55; margin: 0 0 18px; line-height: 1.6; }
  .p-card { border-top: 1px solid #1A1830; padding: 14px 0 10px; }
  .p-card h3 { margin: 0 0 8px; font: 500 10px var(--mono); letter-spacing: 0.3em; color: var(--c, #C9C6E8); }
  .p-row { display: grid; grid-template-columns: 78px 1fr 58px; align-items: center; gap: 10px; min-height: 30px; }
  .p-row label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  .p-row output { font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; color: #D8DAF0; }
  .p-row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; height: 26px; background: transparent; cursor: pointer; }
  .p-row input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #2A2842; }
  .p-row input[type=range]::-moz-range-track { height: 1px; background: #2A2842; }
  .p-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
      background: var(--c, #9D5CFF); box-shadow: 0 0 10px var(--c, #9D5CFF); border: 0; }
  .p-row input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--c, #9D5CFF); border: 0; }
  .p-row input[type=range]:focus-visible { outline: 1px solid var(--label); outline-offset: 2px; }
  .j-sum { display: grid; gap: 6px; font-size: 11px; letter-spacing: 0.04em; line-height: 1.5; margin-bottom: 16px; }
  .j-sum b { font-weight: 500; color: #E9E6FF; }
  .j-list { display: grid; gap: 0; font-size: 10px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .j-item { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid #14132A; }
  .j-item .st { color: #C9C6E8; letter-spacing: 0.14em; }
  .j-item .mt { opacity: 0.7; text-align: right; }
  /* EDGE COLUMNS — volume (right) and density (left): invisible until touched */
  .col { position: fixed; top: 26%; height: 44%; width: 40px; z-index: 12; touch-action: none; cursor: ns-resize;
         opacity: 0; transition: opacity 1.4s ease; }
  .col.show { opacity: 1; transition: opacity 0.35s ease; }
  .col.off { pointer-events: none; }
  .col .trk { position: absolute; top: 0; bottom: 0; left: calc(50% - 0.5px); width: 1px; background: color-mix(in srgb, var(--c) 30%, transparent); }
  .col .fill { position: absolute; bottom: 0; left: calc(50% - 1px); width: 2px; border-radius: 1px;
               background: linear-gradient(to top, color-mix(in srgb, var(--c) 20%, transparent), var(--c)); box-shadow: 0 0 10px var(--c); }
  .col .knob { position: absolute; left: calc(50% - 5.5px); width: 11px; height: 11px; border-radius: 50%; background: var(--c);
               box-shadow: 0 0 14px var(--c), 0 0 4px #fff; transform: translateY(50%); }
  .col .lab { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font: 500 8px var(--mono);
              letter-spacing: 0.12em; color: var(--c); white-space: nowrap; text-align: center; }
  .col .lab2 { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font: 500 10px var(--mono);
               color: var(--c); font-variant-numeric: tabular-nums; }
  /* CHECK-IN — five small dots, optional */
  .check { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 30px; font-size: 9px;
           letter-spacing: 0.16em; text-transform: uppercase; transition: opacity 1s ease; }
  .check .dots { display: flex; gap: 2px; }
  .check button { width: 30px; height: 30px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .check button::after { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--label) 70%, transparent); }
  .check button.on::after, .check button:hover::after { background: #C9A8FF; border-color: #C9A8FF; box-shadow: 0 0 8px #9D5CFF; }
  .check .done { width: auto; height: auto; font: 500 9px var(--mono); letter-spacing: 0.2em; color: var(--label); padding: 8px 10px; }
  .check .done::after { display: none; }
</style>
</head><body>
<div id="lamp" aria-hidden="true"></div>
<div class="col left off" id="colDen" style="--c:#9D5CFF" role="slider" aria-label="Density" aria-valuemin="0" aria-valuemax="100" tabindex="-1">
  <div class="lab">DENSITY</div><div class="trk"></div><div class="fill"></div><div class="knob"></div><div class="lab2"></div></div>
<div class="col right off" id="colVol" style="--c:#2EE6D6" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" tabindex="-1">
  <div class="lab">VOLUME</div><div class="trk"></div><div class="fill"></div><div class="knob"></div><div class="lab2"></div></div>
<div class="prefs" id="prefs" hidden role="dialog" aria-label="Settings">
  <div class="prefs-in">
    <div class="p-top">
      <div class="p-tabs" role="tablist">
        <button class="p-tab" role="tab" id="tabSound" aria-selected="true">Sound</button>
        <button class="p-tab" role="tab" id="tabJournal" aria-selected="false">Journal</button>
      </div>
      <button class="p-act" id="prefsClose">Close</button>
    </div>
    <div id="paneSound"></div>
    <div id="paneJournal" hidden></div>
  </div>
</div>
<canvas id="dust" aria-hidden="true"></canvas>

<div class="app">
  <h1 class="wordmark">INTERSTATE</h1>
  <p class="edition">M A L E</p>
  <p class="sess" id="sess">&nbsp;</p>

  <div class="stage" id="stage">
    <canvas id="dial" tabindex="0" aria-label="Five concentric knobs: sub, wind, cluster, timbre, pulse. Tap the centre to start or stop. Press a ring and turn it. Arrow keys and Page Up or Down also turn them."></canvas>
  </div>

  <p class="hint" id="hint">Headphones on · v19</p>
  <p class="weekly" id="weekly">&nbsp;</p>
  <div class="sess-ctl" id="sessCtl" hidden>
    <button class="end" id="guide">Guide · breath</button>
    <button class="end" id="lampBtn">Lamp · off</button>
    <button class="end" id="end">End session</button>
  </div>
  <div class="check" id="check" hidden></div>
  <button class="end prefs-btn" id="prefsBtn" aria-label="Settings and journal">settings</button>
</div>

<script>
/* =========================================================================
   DSP KERNEL: a line-by-line port of Interstate/Audio/DSPKernel.swift.
   Self-contained (no outer references) so its source can be shipped into an
   AudioWorklet via Function.prototype.toString().
   ========================================================================= */
class InterstateKernel {
  // M8 — a five-element composition engine. Everything swells: each element fades in and out on its own clock.
  // The settings page (cfg) sets, per layer: volume, swell-in and swell-out time, randomisation,
  // pan width (how far each swell can land from centre) and pan drift (how far it travels while it sounds).
  // Every state is its own composition (a score): its own bass line and chords, its own pulse,
  // wind, cluster voicing and morphing timbre. The five rings never change WHAT plays;
  // they set how each element behaves:
  //   SUB      how often the harmony moves (120 s → 40 s) and how long each sub swell lasts
  //   WIND     how often gusts come, how long they last, how far they travel
  //   CLUSTER  how many voices sound (2 → 7) and how fast each one swells
  //   PULSE    how many slow pulse-swells per minute (4–14), and how loose they are
  //   TIMBRE   how fast and how far the timbre morphs
  static scores() {
    return {
      // ARRIVE — "Dusk": D-flat, lydian colour, a slow soft heartbeat, warm low wind, a voice-like pad (oo → oh → ah)
      arrive: { a: 440,
        steps: [{ b: 25, c: [49, 56, 60, 63, 65, 67, 72] }, { b: 34, c: [49, 56, 58, 63, 65, 68, 72] },
                { b: 30, c: [49, 54, 58, 61, 65, 68, 72] }, { b: 32, c: [49, 56, 58, 63, 66, 70, 72] }],
        pulse: { type: 'heart', lo: 5, hi: 10, dub: 0.45, A: 1.2, D: 2.6, lev: 1 },
        wind: { lo: 220, hi: 800, q: 1.1, brown: 0.8, vowel: 0, surf: 0, lev: 1 },
        cl: { lev: 1, h2: 0.18, det: 0.12 },
        tim: { kind: 'vowel', m: [56, 61], lev: 1 } },
      // CONTROL — "Tide": E aeolian over a moving pedal, surf, a bowed tone that brightens as it builds
      control: { a: 440,
        steps: [{ b: 28, c: [52, 59, 62, 66, 67, 71, 74] }, { b: 36, c: [52, 55, 59, 62, 66, 71, 74] },
                { b: 33, c: [52, 55, 59, 60, 64, 67, 71] }, { b: 35, c: [52, 54, 57, 61, 64, 66, 71] }],
        pulse: { type: 'heart', lo: 5, hi: 14, dub: 0.4, A: 1.0, D: 2.2, lev: 1 },
        wind: { lo: 180, hi: 1300, q: 0.8, brown: 0.5, vowel: 0, surf: 1, lev: 1.1 },
        cl: { lev: 0.9, h2: 0.25, det: 0.15 },
        tim: { kind: 'bow', m: [52, 59], lev: 0.9 } },
      // BODY — "Root": open fifths on A, a felt mallet pulse, close breath-like wind, a singing bowl
      body: { a: 440,
        steps: [{ b: 33, c: [45, 52, 57, 59, 64, 69, 71] }, { b: 28, c: [47, 52, 56, 59, 64, 66, 71] },
                { b: 38, c: [45, 50, 57, 59, 64, 66, 69] }, { b: 33, c: [45, 52, 57, 59, 64, 69, 71] }],
        pulse: { type: 'felt', lo: 4, hi: 8, m: 45, A: 1.5, D: 4, lev: 0.9 },
        wind: { lo: 500, hi: 1500, q: 1.8, brown: 0.3, vowel: 0, surf: 0, lev: 2 },
        cl: { lev: 0.9, h2: 0.12, det: 0.1 },
        tim: { kind: 'bowl', m: [45], lev: 1.1 } },
      // RESET — "Night water": F at A = 432, water drops instead of a beat, ocean, a clarinet ↔ string morph
      reset: { a: 432,
        steps: [{ b: 29, c: [53, 57, 60, 64, 67, 69, 72] }, { b: 34, c: [53, 57, 60, 62, 64, 69, 72] },
                { b: 29, c: [53, 57, 60, 64, 67, 69, 72] }, { b: 36, c: [52, 55, 60, 62, 67, 69, 72] }],
        pulse: { type: 'drop', lo: 2, hi: 6, notes: [72, 76, 79, 81, 84], A: 0.8, D: 3.5, lev: 1.1 },
        wind: { lo: 150, hi: 600, q: 0.7, brown: 1, vowel: 0, surf: 1, lev: 1 },
        cl: { lev: 0.9, h2: 0.1, det: 0.08 },
        tim: { kind: 'oddeven', m: [41, 48], lev: 1 } },
      // PRACTICE — "528": C at A = 444 (C5 = 528 Hz) with its binaural pair, whispering wind, a vowel pad
      practice: { a: 444,
        steps: [{ b: 36, c: [55, 59, 62, 64, 67, 71, 74] }, { b: 32, c: [55, 60, 62, 63, 67, 72, 74] },
                { b: 29, c: [55, 57, 60, 64, 67, 69, 71] }, { b: 31, c: [55, 57, 60, 62, 67, 69, 74] }],
        bin: { m: 72, lev: 1 },
        pulse: { type: 'heart', lo: 5, hi: 10, dub: 0.45, A: 1.2, D: 2.6, lev: 0.9 },
        wind: { lo: 300, hi: 1100, q: 4, brown: 0.2, vowel: 1, surf: 0, lev: 2.6 },
        cl: { lev: 0.9, h2: 0.15, det: 0.1 },
        tim: { kind: 'vowel', m: [60, 67], lev: 0.9 } }
    };
  }

  static defaultCfg() {
    const L = (vol, i, o, rnd, width, drift) => ({ vol, in: i, out: o, rnd, width, drift });
    return { space: 1, L: {
      sub: L(1, 18, 22, 0.4, 0.15, 0.4), wind: L(1, 10, 13, 0.5, 0.85, 0.6), cluster: L(1, 20, 25, 0.5, 0.7, 0.5),
      pulse: L(1, 1.2, 2.6, 0.4, 0.35, 0.3), timbre: L(1, 22, 30, 0.5, 0.6, 0.6) } };
  }
  swell(ph, r) { return ph < r ? 0.5 - 0.5 * Math.cos(Math.PI * ph / r) : 0.5 + 0.5 * Math.cos(Math.PI * (ph - r) / (1 - r)); }   // asymmetric: in, then out
  newPan(width, drift, from) {                         // a new place for the next swell, and where it drifts to
    const p0 = (this.rand() * 2 - 1) * width;
    return [p0, p0 * (1 - drift) + (this.rand() * 2 - 1) * width * drift];
  }
  eqp(pan) { const pn = (Math.max(-1, Math.min(1, pan)) + 1) * 0.25 * Math.PI; return [Math.cos(pn) * 1.414, Math.sin(pn) * 1.414]; }
  constructor(sr) {
    this.sr = sr;
    this.rng = 0x9E3779B9 >>> 0;
    this.S = InterstateKernel.scores(); this.cfg = InterstateKernel.defaultCfg();
    this.t = { score: 'arrive', sub: 0.4, wind: 0.4, cluster: 0.5, pulse: 0.4, timbre: 0.4, beat: 4,
               master: 0, focus: -1, form: 0.5, bStage: -1, bDur: 4, uvol: 0.2, density: 0.5 };
    this.uvol = 0.2; this.dens = 0.5;
    this.v = { sub: 0.4, wind: 0.4, cluster: 0.5, pulse: 0.4, timbre: 0.4 };

   AUDIO ENGINE: AudioWorklet (off the main thread), ScriptProcessor fallback.
   ========================================================================= */
const MASTER = 1;                   // session fades run 0 → 1; loudness comes from the volume column
const Engine = {
  ctx: null, node: null, kernel: null, send: null,
  tel: [0.75, 0.75, 0, 0, 0, 0],  // [heartPhase, heartHz, audioTimeOfBlock, droneBreath, airEnv, heart]
  running: false, stopTimer: null,

  async init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC({ latencyHint: 'playback' });
    this.ctx.resume();          // must happen synchronously inside the tap
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      const src = InterstateKernel.toString() + `
        class InterstateProcessor extends AudioWorkletProcessor {
          constructor() { super(); this.k = new InterstateKernel(sampleRate); this.n = 0;
            this.port.onmessage = e => this.k.setTargets(e.data); }
          process(inputs, outputs) {
            const out = outputs[0], L = out[0], R = out[1] || out[0];
            const snd = outputs[1], SL = snd[0], SR = snd[1] || snd[0];
            const k = this.k, ph = k.hPh, t0 = currentTime;
            k.render(L, R, SL, SR, L.length);
            const tel = [ph, k.heartHz, t0, k.env[0], k.env[1], k.env[2], k.env[3], k.env[4]];
            if ((this.n++ & 3) === 0) this.port.postMessage(tel);

      const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));

      this.hasSend = true;
      this.node.port.onmessage = e => { this.tel = e.data; };
      this.send = o => this.node.port.postMessage(o);
    } catch (err) {
      // Fallback: same kernel on the main thread.
      const k = this.kernel = new InterstateKernel(this.ctx.sampleRate);
      this.node = this.ctx.createScriptProcessor(1024, 1, 2);
      const sl = new Float32Array(4096), sr = new Float32Array(4096);
      this.node.onaudioprocess = e => {
        const ph = k.hPh, t0 = e.playbackTime, n = e.outputBuffer.length;
        k.render(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1), sl, sr, n);
        this.tel = [ph, k.heartHz, t0, k.env[0], k.env[1], k.env[2], k.env[3], k.env[4]];

    const lim = this.ctx.createDynamicsCompressor();
    lim.threshold.value = -9; lim.knee.value = 6; lim.ratio.value = 20; lim.attack.value = 0.005; lim.release.value = 0.4;
    lim.connect(this.ctx.destination);
    this.node.connect(lim, 0);
    if (this.hasSend) {                               // the shared hall: a generated, dark impulse
      const conv = this.ctx.createConvolver(); conv.buffer = this.hallIR(4.5);
      const wet = this.ctx.createGain(); wet.gain.value = 0.7;
      this.node.connect(conv, 1); conv.connect(wet).connect(lim);
    }
  },
  hallIR(sec) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) {
        const tt = i / c.sampleRate, damp = 0.25 - 0.18 * Math.min(1, tt / sec);   // darker as it decays
        lp += ((Math.random() * 2 - 1) - lp) * damp;
        d[i] = tt < 0.02 ? 0 : lp * Math.exp(-6.9 * tt / 3.6) * 0.5;
      }
    }
    return buf;
  },

  heardTime() {
    const c = this.ctx;
    if (c.getOutputTimestamp) { const ts = c.getOutputTimestamp(); if (ts && ts.contextTime) return ts.contextTime; }
    return c.currentTime - (c.outputLatency || c.baseLatency || 0);
  },
  cadencePhase() {
    const [p, hz, t0] = this.tel;
    const x = p + hz * (this.heardTime() - t0);
    return x - Math.floor(x);
  },
  waves() { return [this.tel[3], this.tel[4], this.tel[5], this.tel[6], this.tel[7] || 0]; },

  async start(targets) {
    clearTimeout(this.stopTimer);
    if (!this.ctx) await this.init(); else await this.ctx.resume();
    if (typeof cfg !== 'undefined') this.send({ cfg: JSON.parse(JSON.stringify(cfg)) });
    this.send(Object.assign({}, targets, { master: session.active ? 0 : MASTER }));
    this.running = true;
  },
  stop() {
    if (!this.ctx) return;
    this.send({ master: 0 });
    this.running = false;
    this.stopTimer = setTimeout(() => this.ctx.suspend(), 12000);   // after the fade and the hall tail
  }
};

function spiral(r, scale, ang) {
  const n = Math.max(8, Math.floor(r.turns * 220));
  g.beginPath();
  for (let a = 0; a < r.arms; a++) {
    const off = a / r.arms * Math.PI * 2 + ang;
    for (let i = 0; i <= n; i++) {
      const t = i / n, rad = (r.band[0] + (r.band[1] - r.band[0]) * t) * R * scale;
      const th = off + t * r.turns * Math.PI * 2;

function ringStroke(r, ang, a) {
  if (!g.createConicGradient) return hexA(r.color, a);

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

bindCol($('colDen'), () => density, v => { density = v; });
colRender();
function colsActive(on) { ['colVol', 'colDen'].forEach(id => $(id).classList.toggle('off', !on)); }

/* SETTINGS — mixer, swells, randomisation and panning, per layer. Saved on this device only. */
const LAYERS = [
  { k: 'sub',     n: 'SUB',     c: '#2EE6D6', sw: [4, 60, 1] },
  { k: 'wind',    n: 'WIND',    c: '#4A7BFF', sw: [2, 40, 1] },
  { k: 'cluster', n: 'CLUSTER', c: '#9D5CFF', sw: [4, 60, 1] },
  { k: 'timbre',  n: 'TIMBRE',  c: '#D07CFF', sw: [4, 60, 1] },
  { k: 'pulse',   n: 'PULSE',   c: '#F07CC0', sw: [0.3, 6, 0.1] }
];
function loadCfg() {
  const d = InterstateKernel.defaultCfg();
  try { const v = JSON.parse(localStorage.getItem('interstate.cfg') || 'null');
        if (v && v.L) { if (typeof v.space === 'number') d.space = v.space; for (const k in d.L) Object.assign(d.L[k], v.L[k] || {}); } } catch (e) {}
  return d;
}
let cfg = loadCfg();
function saveCfg() { try { localStorage.setItem('interstate.cfg', JSON.stringify(cfg)); } catch (e) {} }
function sendCfg() { if (Engine.send) Engine.send({ cfg: JSON.parse(JSON.stringify(cfg)) }); }
const fmtDb = v => v <= 0.001 ? 'off' : `${(20 * Math.log10(v)).toFixed(1)} dB`;
const fmtS = v => v < 10 ? `${v.toFixed(1)} s` : `${Math.round(v)} s`;
const fmtPct = v => `${Math.round(v * 100)}%`;
function pRow(label, min, max, step, get, set, fmt, color) {
  const row = document.createElement('div'); row.className = 'p-row';
  const id = 'p' + Math.random().toString(36).slice(2, 8);
  row.innerHTML = `<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"><output></output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  if (color) row.style.setProperty('--c', color);
  const show = () => { out.textContent = fmt(get()); };
  inp.value = get(); show();
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); show(); saveCfg(); sendCfg(); });
  row.sync = () => { inp.value = get(); show(); };
  return row;
}
function buildSound() {
  const pane = $('paneSound'); pane.innerHTML = '';
  const note = document.createElement('p'); note.className = 'p-note';
  note.textContent = 'Changes are heard live. Swell times are at the ring’s mid position; turning the ring still lengthens or shortens them.';
  pane.appendChild(note);
  const mix = document.createElement('div'); mix.className = 'p-card'; mix.innerHTML = '<h3>MIX</h3>';
  LAYERS.forEach(Ly => mix.appendChild(pRow(Ly.n, 0, 1.5, 0.01, () => cfg.L[Ly.k].vol, v => { cfg.L[Ly.k].vol = v; }, fmtDb, Ly.c)));
  mix.appendChild(pRow('SPACE', 0, 2, 0.01, () => cfg.space, v => { cfg.space = v; }, fmtPct));
  pane.appendChild(mix);
  LAYERS.forEach(Ly => {
    const c = cfg.L[Ly.k], card = document.createElement('div'); card.className = 'p-card'; card.style.setProperty('--c', Ly.c);
    card.innerHTML = `<h3>${Ly.n}</h3>`;
    const [lo, hi, st] = Ly.sw;
    card.appendChild(pRow('Swell in', lo, hi, st, () => cfg.L[Ly.k].in, v => { cfg.L[Ly.k].in = v; }, fmtS, Ly.c));
    card.appendChild(pRow('Swell out', lo, hi, st, () => cfg.L[Ly.k].out, v => { cfg.L[Ly.k].out = v; }, fmtS, Ly.c));
    card.appendChild(pRow('Random', 0, 1, 0.01, () => cfg.L[Ly.k].rnd, v => { cfg.L[Ly.k].rnd = v; }, fmtPct, Ly.c));
    card.appendChild(pRow('Pan width', 0, 1, 0.01, () => cfg.L[Ly.k].width, v => { cfg.L[Ly.k].width = v; }, v => v < 0.02 ? 'centre' : fmtPct(v), Ly.c));
    card.appendChild(pRow('Pan drift', 0, 1, 0.01, () => cfg.L[Ly.k].drift, v => { cfg.L[Ly.k].drift = v; }, v => v < 0.02 ? 'still' : fmtPct(v), Ly.c));
    pane.appendChild(card);
  });
  const reset = document.createElement('div'); reset.className = 'p-card';
  reset.innerHTML = '<button class="p-act" id="cfgReset">Reset sound to defaults</button>';
  pane.appendChild(reset);
  $('cfgReset').addEventListener('click', () => { cfg = InterstateKernel.defaultCfg(); saveCfg(); sendCfg(); buildSound(); });
}

/* JOURNAL — private, on this device only. Neutral words; no explicit content anywhere. */
const JKEY = 'interstate.journal';
const jLoad = () => { try { return JSON.parse(localStorage.getItem(JKEY) || '[]'); } catch (e) { return []; } };
const jSave = a => { try { localStorage.setItem(JKEY, JSON.stringify(a.slice(-300))); } catch (e) {} };
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function buildJournal() {
  const pane = $('paneJournal'), J = jLoad(), now = Date.now(), day = 864e5;
  const wk = J.filter(e => now - e.d < 7 * day), mo = J.filter(e => now - e.d < 30 * day);
  const shifts = J.filter(e => e.pre && e.post).slice(-10).map(e => e.post - e.pre);
  const ctlS = J.filter(e => e.s === 'control');
  const firsts = ctlS.filter(e => e.first != null).map(e => e.first);
  let firstTrend = '';
  if (firsts.length >= 4) {
    const h = Math.floor(firsts.length / 2), a = avg(firsts.slice(0, h)), b = avg(firsts.slice(-h));
    firstTrend = ` · ${b >= a ? 'later' : 'earlier'} by ${mmss(Math.abs(b - a))} than your first sessions`;
  }
  const ctlR = ctlS.filter(e => e.ctl).slice(-5).map(e => e.ctl);
  const sum = [
    `<div><b>${wk.length}</b> session${wk.length === 1 ? '' : 's'} this week · <b>${mo.length}</b> in 30 days · <b>${Math.round(mo.reduce((x, e) => x + (e.min || 0), 0))}</b> min</div>`,
    shifts.length ? `<div>Settled, before → after: <b>${(avg(shifts) >= 0 ? '+' : '') + avg(shifts).toFixed(1)}</b> on average (last ${shifts.length})</div>` : '<div>Tap a dot before and after a session to see how much it shifts you.</div>',
    firsts.length ? `<div>CONTROL: first edge at <b>${mmss(avg(firsts.slice(-5)))}</b> (last ${Math.min(5, firsts.length)})${firstTrend}</div>` : '',
    ctlR.length ? `<div>CONTROL: felt control <b>${avg(ctlR).toFixed(1)}</b> / 5 (last ${ctlR.length})</div>` : ''
  ].join('');
  const names = { arrive: 'ARRIVE', control: 'CONTROL', body: 'BODY', reset: 'RESET', practice: 'PRACTICE' };
  const items = J.slice(-20).reverse().map(e => {
    const d = new Date(e.d), date = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const bits = [`${Math.round(e.min || 0)} min`];
    if (e.pre || e.post) bits.push(`settled ${e.pre || '·'}→${e.post || '·'}`);
    if (e.s === 'control') { bits.push(`${e.edges || 0} edge${e.edges === 1 ? '' : 's'}`); if (e.first != null) bits.push(`first ${mmss(e.first)}`); if (e.ctl) bits.push(`control ${e.ctl}/5`); }
    return `<div class="j-item"><span>${date}</span><span class="st">${names[e.s] || e.s}</span><span class="mt">${bits.join(' · ')}</span></div>`;
  }).join('');
  pane.innerHTML = `<p class="p-note">Kept only on this device. Nothing is sent anywhere.</p>
    <div class="j-sum">${sum}</div><div class="j-list">${items || '<p class="p-note">No sessions yet.</p>'}</div>
    <div class="p-card"><button class="p-act" id="jClear">Clear journal</button></div>`;
  let armed = false;
  $('jClear').addEventListener('click', e => {
    if (!armed) { armed = true; e.target.textContent = 'Tap again to clear everything'; setTimeout(() => { armed = false; if ($('jClear')) $('jClear').textContent = 'Clear journal'; }, 4000); return; }
    jSave([]); try { localStorage.removeItem('interstate.sessions'); } catch (err) {} buildJournal();
  });
}
function openPrefs(tab) {
  $('prefs').hidden = false; showTab(tab || 'sound'); lastInteract = performance.now() / 1000;
}
function showTab(t) {
  $('tabSound').setAttribute('aria-selected', t === 'sound'); $('tabJournal').setAttribute('aria-selected', t === 'journal');
  $('paneSound').hidden = t !== 'sound'; $('paneJournal').hidden = t !== 'journal';
  if (t === 'sound') buildSound(); else buildJournal();
}
$('prefsBtn').addEventListener('click', () => openPrefs('sound'));
$('prefsClose').addEventListener('click', () => { $('prefs').hidden = true; lastInteract = performance.now() / 1000; });
$('tabSound').addEventListener('click', () => showTab('sound'));
$('tabJournal').addEventListener('click', () => showTab('journal'));

/* CHECK-IN — optional, one tap. Before: how settled. After: how settled (and, in CONTROL, how much control). */
let checkTimer = null;
function askCheck(label, onPick, extra) {
  const el = $('check'); clearTimeout(checkTimer);
  el.innerHTML = `<span>${label}</span><span class="dots">${[1, 2, 3, 4, 5].map(n => `<button aria-label="${n} of 5" data-n="${n}"></button>`).join('')}</span>` + (extra || '');
  el.hidden = false; el.style.opacity = 1;
  el.querySelectorAll('.dots button').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('.dots button').forEach(x => x.classList.toggle('on', +x.dataset.n <= +b.dataset.n));
    onPick(+b.dataset.n);
  }));
  return el;
}
function hideCheck(delay) { clearTimeout(checkTimer); checkTimer = setTimeout(() => { $('check').style.opacity = 0; setTimeout(() => { $('check').hidden = true; }, 1000); }, delay || 0); }
function beforeCheck() {
  askCheck('settled now?', n => { if (session.entry) session.entry.pre = n; hideCheck(900); });
  hideCheck(15000);
}
function afterCheck(e, done) {
  const isCtl = e && e.s === 'control';
  let step = 0;
  const finish = () => { clearTimeout(checkTimer); $('check').hidden = true; done(); };
  const second = () => { askCheck('control?', n => { e.ctl = n; setTimeout(finish, 700); }, '<button class="done">skip</button>');
                         $('check').querySelector('.done').addEventListener('click', finish); };
  askCheck('and now?', n => { e.post = n; if (isCtl && !step++) setTimeout(second, 600); else setTimeout(finish, 700); }, '<button class="done">skip</button>');
  $('check').querySelector('.done').addEventListener('click', () => isCtl && !step++ ? second() : finish());
  checkTimer = setTimeout(finish, 30000);
}
let hf = null;
document.addEventListener('pointerdown', e => {
  if (!isControl()) return;
  if (e.target.closest && e.target.closest('button, .prefs, .check, .col')) return;
  if (e.target === cv) { const { dist } = polar(e); if (ringAt(dist) === 0) return; }   // turning the arousal ring
  hf = { x: e.clientX, y: e.clientY, fired: false, id: e.pointerId };
  hf.timer = setTimeout(() => { if (hf) { hf.fired = true; toggle(); buzz(40); } }, 700);   // long press = pause
}, true);
document.addEventListener('pointerup', e => {
  if (!hf || e.pointerId !== hf.id) return;
  clearTimeout(hf.timer);
  const moved = Math.hypot(e.clientX - hf.x, e.clientY - hf.y);
  if (!hf.fired && moved < 20 && playing) startSettle();               // tap = close to the edge
  hf = null;
}, true);
showHome();

async function toggle() {
  if (playing) {
    Engine.stop(); playing = false; stoppedAt = performance.now();
    if (session.active) $('hint').textContent = 'Paused. Tap the centre to continue.';
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  } else {
    playing = true; lastPhase = 0; stoppedAt = 0;
    try { await Engine.start(targets()); }
    catch (err) { playing = false; $('hint').textContent = 'Audio could not start. Tap the centre again.'; return; }
    if (session.active) $('hint').textContent = HINTS[guide.mode];
    lastInteract = performance.now() / 1000;
    buzz(20);
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
}
cv.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
  const steps = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowRight: [1, 1], ArrowLeft: [1, -1], PageUp: [3, 1], PageDown: [3, -1], Home: [2, 1], End: [2, -1] };
  if (steps[e.key]) { e.preventDefault(); const [i, s] = steps[e.key]; rotate(i, s * 0.05 * 2 * Math.PI, -Math.PI / 2, 0.05); }
});
</script>
</body></html>
