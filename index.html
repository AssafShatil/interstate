<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interstate Web Demo</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
  /* Single-look design: Interstate is pure black by identity, in any host theme. */
  :root {
    color-scheme: dark;
    --black: #000000;
    --turq: #2EE6D6;       /* 01 */
    --blue: #4A7BFF;       /* 02 */
    --violet: #9D5CFF;     /* 03 */
    --label: #8A8DB0;      /* lavender grey */
    --faint: #15142A;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; background: var(--black); }
  body { background: radial-gradient(120% 70% at 50% 42%, #0B0920 0%, #05040E 45%, #000 80%) var(--black); }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .app { position: relative; }
  body {
    margin: 0;
    color: var(--label);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding-inline: 16px;
    padding-block: 52px 20px;
    gap: 8px;
  }
  .wordmark {
    margin: 0;
    font-weight: 300; font-size: 13px;
    letter-spacing: 0.6em; padding-left: 0.6em;   /* optically centre the tracked word */
    color: var(--label);
  }
  .stage {
    flex: 1 1 auto; min-height: 0; width: 100%;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; max-width: 100%; transform: translateY(-38px); }   /* ≈ 1 cm up */
  canvas:focus-visible { outline: 1px solid var(--label); outline-offset: 4px; border-radius: 50%; }

  .wordmark, .hint, .hud { transition: opacity 1.2s ease; }
  body.rest .wordmark, body.rest .hint { opacity: 0; }
  .hud { height: 44px; display: grid; justify-items: center; align-content: center; gap: 4px; opacity: 0; }
  .hud.show { opacity: 1; transition: opacity 0.15s ease; }
  .hud-name { font-size: 10px; letter-spacing: 0.28em; padding-left: 0.28em; }
  .hud-val { font-size: 18px; font-weight: 500; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; min-height: 16px; font-size: 10px; letter-spacing: 0.14em; text-align: center; }
  .readouts {
    width: 100%; max-width: 420px;
    display: grid; gap: 12px;
  }
  .row { display: grid; grid-template-columns: 2px 1fr auto; column-gap: 10px; align-items: baseline; }
  .row .bar { align-self: stretch; border-radius: 1px; }
  .row .name { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .row .cap { font-size: 9px; letter-spacing: 0.06em; opacity: 0.75; margin-top: 3px; }
  .row .val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .outer .bar { background: var(--turq); box-shadow: 0 0 8px var(--turq); }     .outer .val { color: var(--turq); text-shadow: 0 0 10px rgba(46,230,214,.45); }
  .middle .bar { background: var(--blue); box-shadow: 0 0 8px var(--blue); }     .middle .val { color: var(--blue); text-shadow: 0 0 10px rgba(74,123,255,.45); }
  .core .bar { background: var(--violet); box-shadow: 0 0 8px var(--violet); }   .core .val { color: var(--violet); text-shadow: 0 0 10px rgba(157,92,255,.45); }

  .status {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 9px; letter-spacing: 0.08em; padding-top: 4px;
  }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--label); margin-right: 8px; vertical-align: middle; }
  .dot.on { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .note { font-size: 9px; letter-spacing: 0.04em; opacity: 0.6; text-align: center; max-width: 420px; line-height: 1.5; margin: 0; }
  .err { color: var(--violet); }
</style>
</head><body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="app">
  <h1 class="wordmark">INTERSTATE</h1>

  <div class="stage" id="stage">
    <canvas id="dial" tabindex="0" aria-label="Three concentric knobs. Tap the centre to start or stop. Press a ring and turn it. Arrow keys and Page Up or Down also turn them."></canvas>
  </div>

  <p class="hint" id="hint">Headphones on. Tap the centre to begin.</p>
</div>

<script>
/* =========================================================================
   DSP KERNEL: a line-by-line port of Interstate/Audio/DSPKernel.swift.
   Self-contained (no outer references) so its source can be shipped into an
   AudioWorklet via Function.prototype.toString().
   ========================================================================= */
class InterstateKernel {
  // Port of prototypes/interstate_palette_v4.scd — the four approved layers:
  //   DRONE      \wellnessDrone: L 55 Hz, R 55 + beat (binaural), 2nd partial, 0.045 Hz breath
  //   HEARTBEAT  \ist_heart (Dream Timbre Mvt V): 55 Hz lub, SinOsc-shaped .pow(4), soft drive
  //   CLUSTER    \ist_cluster: the box ×2, one voice per pitch, 3 drifting oscs each, own swells
  //   AIR        \ist_air (Dream Timbre \dtAirSwell): stochastic dark noise swells
  // Ring 01 = drone beat · 02 = air density/brightness · 03 = cluster presence · 04 (centre) = heartbeat BPM.
  constructor(sr) {
    this.sr = sr;
    this.rng = 0x9E3779B9 >>> 0;
    this.t = { beat: 1.2, air: 0.5, cluster: 0.5, bpm: 45, master: 0 };
    this.beat = 1.2; this.air = 0.5; this.cluster = 0.5; this.bpm = 45; this.master = 0;
    // drone
    this.dL = 0; this.dR = 0; this.dL2 = 0; this.dR2 = 0; this.breathPh = 0.75; this.breath = 0.45;
    // heartbeat
    this.hPh = 0.75; this.lub = 0; this.hWander = this.lfn(0.02, 0.92, 1.08); this.heartHz = 0.75;
    // cluster: your box, one octave up
    const box = [27.5, 43.65, 46.25, 55.0, 65.41, 69.30, 82.41];
    this.voices = box.map(f0 => ({
      f: f0 * 2,
      wave: { inc: 1 / (18 + this.rand() * 14), ph: this.rand() },
      oscs: [0, 1, 2].map(() => ({
        ph: this.rand(),
        det: this.lfn(0.001 + this.rand() * 0.008, -0.012, 0.012),
        amp: this.lfn(0.003 + this.rand() * 0.009, 0.3, 1.0),
        saw: this.lfn(0.002 + this.rand() * 0.004, 0.0, 0.25),
        pan: this.lfn(0.001 + this.rand() * 0.007, -0.6, 0.6),
        gl: 0, gr: 0, inc: 0, sw: 0
      })),
      env: 0
    }));
    this.clLpL = 0; this.clLpR = 0; this.clA = 1 - Math.exp(-2 * Math.PI * 1400 / sr);
    // air swells
    this.swells = []; this.nextSwell = 1.5; this.airEnv = 0;
    this.env = new Float64Array(4);   // telemetry: drone breath, air, heart, cluster
  }
  rand() {
    let x = this.rng; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; this.rng = x;
    return x / 4294967296;
  }
  white() { return this.rand() * 2 - 1; }
  lfn(rate, lo, hi) { return { a: lo + (hi - lo) * Math.random(), b: lo + (hi - lo) * Math.random(), t: 0, rate, lo, hi, v: 0 }; }
  stepLfn(o, dtBlock) {        // LFNoise1-style: linear ramps between random values
    o.t += o.rate * dtBlock;
    while (o.t >= 1) { o.t -= 1; o.a = o.b; o.b = o.lo + (o.hi - o.lo) * this.rand(); }
    o.v = o.a + (o.b - o.a) * o.t; return o.v;
  }
  setTargets(o) { Object.assign(this.t, o); }
  spawnSwell() {
    const air = this.air, dark = 1 - 0.45 * air;           // more air = a little brighter
    const pick = this.rand();
    let ch;                                                // 0 = A, 1 = B, 2 = C (your characters)
    if (this.rand() < dark) ch = pick > 0.5 ? 2 : 0;
    else ch = pick > 0.6 ? 2 : (pick > 0.32 ? 1 : 0);
    this.swells.push({
      ch, t: 0, att: 6 + this.rand() * 8, rel: 8 + this.rand() * 10,
      reg: 0.55 + this.rand() * (1.8 - 0.8 * dark - 0.55),
      pan: this.rand() * 1.6 - 0.8, drift: this.lfn(0.03 + this.rand() * 0.05, -0.25, 0.25),
      br: 0, pk: new Float64Array(7), lp1: [0, 0], lp2: [0, 0], hp: [0, 0], amp: 0.45 + 0.4 * air
    });
  }
  render(L, R, SL, SR, n) {
    const TP = 2 * Math.PI, inv = 1 / this.sr, dtB = n * inv, t = this.t;
    // ---- control rate (once per block) ----
    const k = (tau) => 1 - Math.exp(-dtB / tau);
    this.beat += (t.beat - this.beat) * k(0.5);
    this.air += (t.air - this.air) * k(0.5);
    this.cluster += (t.cluster - this.cluster) * k(0.8);
    const clGain = 2 * this.cluster * this.cluster;       // 0 … 2× (50 % = the v4 level)
    this.bpm += (t.bpm - this.bpm) * k(3);
    const m0 = this.master; this.master += (t.master - this.master) * k(1.2); const m1 = this.master;
    this.breathPh = (this.breathPh + 0.045 * dtB) % 1;
    this.breath = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(TP * this.breathPh));
    this.heartHz = (this.bpm / 60) * this.stepLfn(this.hWander, dtB);
    const hInc = this.heartHz * inv;
    // cluster voices
    for (const v of this.voices) {
      v.wave.ph = (v.wave.ph + v.wave.inc * dtB) % 1;
      v.env = 0.1 + 0.9 * (0.5 - 0.5 * Math.cos(TP * v.wave.ph));
      for (const o of v.oscs) {
        o.inc = v.f * (1 + this.stepLfn(o.det, dtB)) * inv;
        const a = this.stepLfn(o.amp, dtB) * v.env * 0.09 * 0.14 * clGain;
        const pn = (this.stepLfn(o.pan, dtB) + 1) * 0.25 * Math.PI;       // equal-power
        o.gl = Math.cos(pn) * a; o.gr = Math.sin(pn) * a; o.sw = this.stepLfn(o.saw, dtB);
      }
    }
    // air swells
    this.nextSwell -= dtB;
    if (this.nextSwell <= 0 && this.swells.length < 5) {
      this.spawnSwell();
      const gap = 11 - 8 * this.air;                        // 11 s … 3 s between swells
      this.nextSwell = gap * (0.6 + 0.8 * this.rand());
    }
    let airSum = 0;
    for (let i = this.swells.length - 1; i >= 0; i--) {
      const w = this.swells[i]; w.t += dtB;
      if (w.t >= w.att + w.rel) { this.swells.splice(i, 1); continue; }
      const x = w.t < w.att ? w.t / w.att : 1 - (w.t - w.att) / w.rel;
      w.env = 0.5 - 0.5 * Math.cos(Math.PI * x);             // Env \sine
      const prox = w.env, reg = w.reg;
      let lp, hp;
      if (w.ch === 0) { lp = (900 + prox * 2600) * reg; hp = (140 + prox * 60) * reg; }
      else if (w.ch === 1) { lp = 3500 * reg; hp = 500 * reg; }
      else { lp = (300 + prox * 900) * reg; hp = 50 * reg; }
      const dist = 0.9 - prox * 0.35, airLP = 16000 - dist * 14200;
      lp = Math.min(Math.max(lp, 120), airLP, 9000);
      w.a1 = 1 - Math.exp(-TP * lp * inv); w.ah = 1 - Math.exp(-TP * Math.min(hp, 900) * inv);
      const g = w.env * 0.32 * w.amp;
      const pan = Math.max(-1, Math.min(1, w.pan + this.stepLfn(w.drift, dtB)));
      const pn = (pan + 1) * 0.25 * Math.PI;
      w.gl = Math.cos(pn) * g * (1 - dist * 0.6); w.gr = Math.sin(pn) * g * (1 - dist * 0.6);
      w.sl = Math.cos(pn) * g * dist * 0.6;      w.sr = Math.sin(pn) * g * dist * 0.6;
      airSum += w.env;
    }
    this.airEnv = Math.min(1, airSum);

    // ---- audio rate ----
    const beat = this.beat, br = this.breath, fD = 55;
    for (let i = 0; i < n; i++) {
      const m = m0 + (m1 - m0) * (i / n);
      // DRONE
      const dl = Math.sin(this.dL) + 0.12 * Math.sin(this.dL2);
      const dr = Math.sin(this.dR) + 0.12 * Math.sin(this.dR2);
      this.dL += TP * fD * inv; this.dL2 += TP * fD * 2 * inv;
      this.dR += TP * (fD + beat) * inv; this.dR2 += TP * (fD + beat) * 2 * inv;
      if (this.dL > TP) this.dL -= TP; if (this.dL2 > TP) this.dL2 -= TP;
      if (this.dR > TP) this.dR -= TP; if (this.dR2 > TP) this.dR2 -= TP;
      const droneL = dl * 0.18 * br, droneR = dr * 0.18 * br;
      // HEARTBEAT
      const shape = Math.pow(0.5 + 0.5 * Math.sin(TP * this.hPh), 4);
      this.hPh += hInc; if (this.hPh >= 1) this.hPh -= 1;
      let lub = Math.sin(this.lub) * 0.35; this.lub += TP * 55 * inv; if (this.lub > TP) this.lub -= TP;
      lub = Math.tanh(lub * 2.5) * 0.45 * shape;
      // CLUSTER
      let cl = 0, cr = 0;
      for (const v of this.voices) for (const o of v.oscs) {
        o.ph += o.inc; if (o.ph >= 1) o.ph -= 1;
        const sgl = Math.sin(TP * o.ph) + o.sw * (2 * o.ph - 1);
        cl += sgl * o.gl; cr += sgl * o.gr;
      }
      this.clLpL += (cl - this.clLpL) * this.clA; this.clLpR += (cr - this.clLpR) * this.clA;
      // AIR
      let al = 0, ar = 0, sl = 0, sr = 0;
      for (const w of this.swells) {
        const wn = this.white();
        let x;
        if (w.ch === 1) x = this.white() * 0.4 + wn * 0.6 * 0.5;
        else {
          w.br = (w.br + 0.02 * wn) / 1.02;
          const pk = w.pk;
          pk[0] = 0.99886 * pk[0] + wn * 0.0555179; pk[1] = 0.99332 * pk[1] + wn * 0.0750759;
          pk[2] = 0.969 * pk[2] + wn * 0.153852; pk[3] = 0.8665 * pk[3] + wn * 0.3104856;
          pk[4] = 0.55 * pk[4] + wn * 0.5329522; pk[5] = -0.7616 * pk[5] - wn * 0.016898;
          const pink = (pk[0] + pk[1] + pk[2] + pk[3] + pk[4] + pk[5] + pk[6] + wn * 0.5362) * 0.11;
          pk[6] = wn * 0.115926;
          x = w.ch === 0 ? w.br * 3.5 * 0.35 + pink * 0.45 + wn * 0.2 * 0.3
                         : w.br * 3.5 * 0.6 + pink * 0.35 + wn * 0.05 * 0.3;
        }
        w.lp1[0] += (x - w.lp1[0]) * w.a1; w.lp2[0] += (w.lp1[0] - w.lp2[0]) * w.a1;
        w.hp[0] += (w.lp2[0] - w.hp[0]) * w.ah;
        const y = (w.lp2[0] - w.hp[0]) * 2.2;
        al += y * w.gl; ar += y * w.gr; sl += y * w.sl; sr += y * w.sr;
      }
      L[i] = Math.tanh((droneL + lub + this.clLpL + al) * m);
      R[i] = Math.tanh((droneR + lub + this.clLpR + ar) * m);
      // reverb send (dry-ish layers send less)
      SL[i] = (droneL * 0.05 + lub * 0.08 + this.clLpL * 0.5 + sl) * m;
      SR[i] = (droneR * 0.05 + lub * 0.08 + this.clLpR * 0.5 + sr) * m;
    }
    this.env[0] = (br - 0.45) / 0.55; this.env[1] = this.airEnv;
    this.env[2] = Math.pow(0.5 + 0.5 * Math.sin(TP * this.hPh), 4);
    let ce = 0; for (const v of this.voices) ce += v.env; this.env[3] = (ce / this.voices.length) * Math.min(1, clGain);
  }
}

/* =========================================================================
   AUDIO ENGINE: AudioWorklet (off the main thread), ScriptProcessor fallback.
   ========================================================================= */
const Engine = {
  ctx: null, node: null, kernel: null, send: null,
  tel: [0.75, 0.75, 0, 0, 0, 0],  // [heartPhase, heartHz, audioTimeOfBlock, droneBreath, airEnv, heart]
  running: false, stopTimer: null,

  async init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC({ latencyHint: 'playback' });
    this.ctx.resume();          // must happen synchronously inside the tap
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      const src = InterstateKernel.toString() + `
        class InterstateProcessor extends AudioWorkletProcessor {
          constructor() { super(); this.k = new InterstateKernel(sampleRate); this.n = 0;
            this.port.onmessage = e => this.k.setTargets(e.data); }
          process(inputs, outputs) {
            const out = outputs[0], L = out[0], R = out[1] || out[0];
            const snd = outputs[1], SL = snd[0], SR = snd[1] || snd[0];
            const k = this.k, ph = k.hPh, t0 = currentTime;
            k.render(L, R, SL, SR, L.length);
            const tel = [ph, k.heartHz, t0, k.env[0], k.env[1], k.env[2], k.env[3]];
            if ((this.n++ & 3) === 0) this.port.postMessage(tel);
            return true;
          }
        }
        registerProcessor('interstate', InterstateProcessor);`;
      const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      await this.ctx.audioWorklet.addModule(url);
      this.node = new AudioWorkletNode(this.ctx, 'interstate', { numberOfInputs: 0, numberOfOutputs: 2, outputChannelCount: [2, 2] });
      this.hasSend = true;
      this.node.port.onmessage = e => { this.tel = e.data; };
      this.send = o => this.node.port.postMessage(o);
    } catch (err) {
      // Fallback: same kernel on the main thread.
      const k = this.kernel = new InterstateKernel(this.ctx.sampleRate);
      this.node = this.ctx.createScriptProcessor(1024, 1, 2);
      const sl = new Float32Array(4096), sr = new Float32Array(4096);
      this.node.onaudioprocess = e => {
        const ph = k.hPh, t0 = e.playbackTime, n = e.outputBuffer.length;
        k.render(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1), sl, sr, n);
        this.tel = [ph, k.heartHz, t0, k.env[0], k.env[1], k.env[2], k.env[3]];
      };
      this.send = o => k.setTargets(o);
    }
    this.node.connect(this.ctx.destination, 0);
    if (this.hasSend) {                               // the shared hall: a generated, dark impulse
      const conv = this.ctx.createConvolver(); conv.buffer = this.hallIR(4.5);
      const wet = this.ctx.createGain(); wet.gain.value = 0.7;
      this.node.connect(conv, 1); conv.connect(wet).connect(this.ctx.destination);
    }
  },
  hallIR(sec) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) {
        const tt = i / c.sampleRate, damp = 0.25 - 0.18 * Math.min(1, tt / sec);   // darker as it decays
        lp += ((Math.random() * 2 - 1) - lp) * damp;
        d[i] = tt < 0.02 ? 0 : lp * Math.exp(-6.9 * tt / 3.6) * 0.5;
      }
    }
    return buf;
  },

  heardTime() {
    const c = this.ctx;
    if (c.getOutputTimestamp) { const ts = c.getOutputTimestamp(); if (ts && ts.contextTime) return ts.contextTime; }
    return c.currentTime - (c.outputLatency || c.baseLatency || 0);
  },
  cadencePhase() {
    const [p, hz, t0] = this.tel;
    const x = p + hz * (this.heardTime() - t0);
    return x - Math.floor(x);
  },
  waves() { return [this.tel[3], this.tel[4], this.tel[5], this.tel[6]]; },

  async start(targets) {
    clearTimeout(this.stopTimer);
    if (!this.ctx) await this.init(); else await this.ctx.resume();
    this.send(Object.assign({}, targets, { master: 0.8 }));
    this.running = true;
  },
  stop() {
    if (!this.ctx) return;
    this.send({ master: 0 });
    this.running = false;
    this.stopTimer = setTimeout(() => this.ctx.suspend(), 3000);
  }
};

/* =========================================================================
   RINGS, STATE, MAPPING
   ========================================================================= */
const RINGS = [
  { key: 'outer',  name: 'DRONE',   color: '#2EE6D6', color2: '#4A7BFF', idle:  1, band: [0.82, 0.98], hit: [0.79, 1.14], value: 0.20 },
  { key: 'air',    name: 'AIR',     color: '#4A7BFF', color2: '#9D5CFF', idle: -1, band: [0.60, 0.76], hit: [0.57, 0.79], value: 0.50 },
  { key: 'inner',  name: 'CLUSTER', color: '#9D5CFF', color2: '#D07CFF', idle:  1, band: [0.38, 0.54], hit: [0.35, 0.57], value: 0.50 },
  { key: 'core',   name: 'HEART',   color: '#D07CFF', color2: '#2EE6D6', idle: -1, band: [0.16, 0.32], hit: [0.00, 0.35], value: 0.50 }
];
RINGS.forEach((r, i) => { r.dir = i % 2 ? -1 : 1; r.spin = 0; r.awake = false; r.phase = -Math.PI / 2 + r.value * Math.PI * 2; r.moved = 0; r.rotation = 0; r.active = 0; r.grip = null; r.press = 0; r.teeth = i === 2 ? 36 : 60; });

const map = {
  beat: v => 0.5 + 3.5 * v,            // ring 01: drone binaural beat 0.5–4 Hz (delta → theta)
  air:  v => v,                        // ring 02: air swells, sparse/dark → dense/lighter
  cluster: v => v,                     // ring 03: cluster presence 0–100 %
  bpm:  v => 30 + 30 * v               // ring 04 (centre): heartbeat 30–60 BPM
};
const targets = () => ({ beat: map.beat(RINGS[0].value), air: map.air(RINGS[1].value),
                         cluster: map.cluster(RINGS[2].value), bpm: map.bpm(RINGS[3].value) });

let stoppedAt = 0;
let playing = false, pulse = 0, swell = 0, waveA = 0, clusterEnv = 0, lastPhase = 0;
const particles = [];

/* Haptics: Android browsers support vibrate(); iPhone Safari does not. */
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
let tickAcc = 0, lastTick = 0;

/* =========================================================================
   CANVAS
   ========================================================================= */
const cv = document.getElementById('dial'), g = cv.getContext('2d'), stage = document.getElementById('stage');
let side = 300, R = 140, dpr = 1;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  side = Math.max(200, Math.min(w, h, 520));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cv.style.height = side + 'px';
  cv.width = cv.height = Math.round(side * dpr);
  R = side / 2 / 1.16;      // room for the outer label + glow
}
new ResizeObserver(resize).observe(stage); resize();

function spiral(r, scale, ang) {
  const n = Math.max(8, Math.floor(r.turns * 220));
  g.beginPath();
  for (let a = 0; a < r.arms; a++) {
    const off = a / r.arms * Math.PI * 2 + ang;
    for (let i = 0; i <= n; i++) {
      const t = i / n, rad = (r.band[0] + (r.band[1] - r.band[0]) * t) * R * scale;
      const th = off + t * r.turns * Math.PI * 2;
      const x = rad * Math.cos(th), y = rad * Math.sin(th);
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  }
}

/* A slow conic sweep between the ring's two hues (turquoise → blue → violet),
   rotating with the ring. Falls back to the solid hue on older browsers. */
function ringStroke(r, ang, a) {
  if (!g.createConicGradient) return hexA(r.color, a);
  const cg = g.createConicGradient(ang, 0, 0);
  cg.addColorStop(0.00, hexA(r.color, a));
  cg.addColorStop(0.50, hexA(r.color2, a));
  cg.addColorStop(1.00, hexA(r.color, a));
  return cg;
}

let lastDraw = 0, lastInteract = 0, restDim = 1;

/* Knob scale: each ring's name and value written along its own circumference,
   just outside the orbit, centred on the streak's head (it travels with the knob).
   Faint at rest, bright while turning; hidden in eyes-closed mode. */
const valueText = [
  t => `DRONE ${t.beat.toFixed(1)} Hz`,
  t => `AIR ${Math.round(t.air * 100)}%`,
  t => `CLUSTER ${Math.round(t.cluster * 100)}%`,
  t => `HEART ${Math.round(t.bpm)} BPM`
];
function arcLabel(r, idx, orbit, head) {
  // Horizontal, centred above the ring's circle (12 o'clock), like the legend on a knob.
  const txt = valueText[idx](targets());
  // Hidden at rest: appears only while a finger is on this ring (and fades after).
  // On first load all four show for a few seconds so people learn what the rings are.
  const intro = Math.max(0, Math.min(1, 5 - performance.now() / 1000)) * 0.6;
  const a = Math.max(r.press, r.moved, intro) * restDim;
  if (a < 0.02) return;
  g.save();
  g.font = `500 ${idx === 3 ? 8.5 : 9.5}px "IBM Plex Mono", ui-monospace, Menlo, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.fillStyle = hexA(r.color, 0.9 * a); g.shadowColor = r.color; g.shadowBlur = 6 * a;
  g.fillText(txt, 0, -orbit - (idx === 3 ? 11 : 14));   // clears the streak head when it sits at 12 o'clock
  g.restore();
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now) {
  const dt = Math.min(0.05, lastDraw ? now - lastDraw : 0.016); lastDraw = now;
  // Eyes-closed mode: 20 s after the last touch while playing, everything but the
  // breathing core fades back; any touch brings it forward again.
  const resting = playing && (now - lastInteract > 20);
  restDim += ((resting ? 0.25 : 1) - restDim) * Math.min(1, dt * 0.6);
  document.body.classList.toggle('rest', resting);
  g.setTransform(dpr, 0, 0, dpr, side * dpr / 2, side * dpr / 2);

  // HALO TRAILS: fade the previous frame instead of clearing it, so every moving
  // line leaves a luminous afterimage. Slower fade while a ring is being turned.
  const turning = RINGS.some(r => r.active > 0);
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = `rgba(0,0,0,${turning ? 0.06 : 0.12})`;
  g.fillRect(-side, -side, side * 2, side * 2);
  // Rings draw normally (they settle at their own brightness when still);
  // only the motes add light.
  g.globalCompositeOperation = 'source-over';
  g.lineCap = 'round';

  RINGS.forEach((r, idx) => {
    const act = r.active > 0;
    r.press += ((act ? 1 : 0) - r.press) * 0.25;
    // Each ring is one streak of light — a chakra wheel. It is still until you
    // wake it (turn that ring, or start the session). From then on it keeps
    // spinning; the ring's setting sets its speed, the direction of your last
    // turn sets its direction, and turning pushes it live under your finger.
    // Stopping the session lets the wheels glide to rest.
    r.moved = Math.max(0, r.moved - dt * 1.5);             // 1 → 0 after a turn
    const t = targets();
    const speed = idx === 3 ? (2 * Math.PI * t.bpm / 60) / 4 // heart: one turn every 4 beats
                            : 0.3 + 1.5 * r.value;          // 0.3 … 1.8 rad/s
    const target = (playing || (r.awake && !stoppedAt)) ? speed * r.dir : 0;
    r.spin += (target - r.spin) * Math.min(1, dt * (target ? 2.5 : 0.6));
    r.phase += r.spin * dt;
    const head = r.phase;
    const orbit = ((r.band[0] + r.band[1]) / 2) * R;
    // Brightness breathes with the ring's own sound; the whole wheel dims at rest.
    let energy = act ? 1 : (playing ? 0.6 : 0.45);
    if (idx === 0) energy += 0.35 * waveA;
    if (idx === 1) energy += 0.35 * swell;
    if (idx === 2) energy += 0.3 * clusterEnv;
    if (idx === 3) energy += 0.5 * pulse;
    energy = Math.max(energy * restDim, act ? 1 : 0);
    const dir = r.dir;
    const tail = 0.9 + 1.3 * Math.max(r.press, r.moved);     // tail stretches while turning

    // Faint orbit: where to put your finger.
    g.globalCompositeOperation = 'source-over';
    g.shadowBlur = 0; g.lineWidth = 0.6; g.strokeStyle = hexA(r.color, (0.05 + 0.08 * r.press) * restDim);
    g.beginPath(); g.arc(0, 0, orbit, 0, Math.PI * 2); g.stroke();

    // Core: a breathing violet orb under its streak.
    if (idx === 3) {
      const rr = R * (0.30 + 0.05 * pulse);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, rr);
      gr.addColorStop(0.0, hexA('#C9A8FF', 0.10 + 0.14 * pulse));
      gr.addColorStop(0.35, hexA('#9D5CFF', 0.06 + 0.08 * pulse));
      gr.addColorStop(0.75, hexA('#4A7BFF', 0.025));
      gr.addColorStop(1.0, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rr, 0, Math.PI * 2); g.fill();
    }

    // The streak: 36 short segments from the head back along the orbit, fading
    // and thinning, hue sliding from the ring's colour into its neighbour's.
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    const N = 36;
    for (let i = 0; i < N; i++) {
      const t0 = i / N, t1 = (i + 1) / N;
      const a0 = head - dir * tail * t0, a1 = head - dir * tail * t1;
      const fade = Math.pow(1 - t0, 1.8);
      const col = t0 < 0.4 ? r.color : r.color2;
      // wide soft halo
      g.shadowBlur = 0; g.lineWidth = 10 * fade + 2;
      g.strokeStyle = hexA(col, 0.035 * fade * energy);
      g.beginPath(); g.arc(0, 0, orbit, Math.min(a0, a1), Math.max(a0, a1)); g.stroke();
      // bright filament
      g.shadowColor = col; g.shadowBlur = 10 * fade;
      g.lineWidth = 0.6 + 2.4 * fade;
      g.strokeStyle = hexA(col, 0.55 * fade * energy);
      g.beginPath(); g.arc(0, 0, orbit, Math.min(a0, a1), Math.max(a0, a1)); g.stroke();
    }
    // Head: a hot white-tinted point.
    const hx = orbit * Math.cos(head), hy = orbit * Math.sin(head);
    const hg = g.createRadialGradient(hx, hy, 0, hx, hy, 14 + 6 * r.press);
    hg.addColorStop(0, hexA('#FFFFFF', 0.55 * energy));
    hg.addColorStop(0.25, hexA(r.color, 0.45 * energy));
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.shadowBlur = 0; g.fillStyle = hg;
    g.beginPath(); g.arc(hx, hy, 14 + 6 * r.press, 0, Math.PI * 2); g.fill();

    g.globalCompositeOperation = 'source-over';
    arcLabel(r, idx, orbit, head);

    // Grip halo under the finger.
    if (r.grip !== null && r.press > 0.05) {
      const gx = Math.cos(r.grip) * orbit, gy = Math.sin(r.grip) * orbit;
      const gg = g.createRadialGradient(gx, gy, 0, gx, gy, 0.14 * R);
      gg.addColorStop(0, hexA(r.color, 0.18 * r.press)); gg.addColorStop(1, 'rgba(0,0,0,0)');
      g.shadowBlur = 0; g.fillStyle = gg; g.beginPath(); g.arc(gx, gy, 0.14 * R, 0, Math.PI * 2); g.fill();
    }
  });

  // Halo motes: soft glowing nodes that sweep behind the rotation and drift
  // outward as they fade. The frame fade above stretches each into a comet tail.
  g.shadowBlur = 0; g.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i], age = now - p.born;
    if (age > p.life) { particles.splice(i, 1); continue; }
    const t = age / p.life, th = p.angle + p.drift * age, rad = (p.r + 0.035 * age) * R;
    const x = rad * Math.cos(th), y = rad * Math.sin(th), a = (1 - t) * (1 - t);
    const col = t < 0.5 ? p.color : p.color2;              // hue shifts as it fades
    g.fillStyle = hexA(col, 0.10 * a);
    g.beginPath(); g.arc(x, y, p.size * 3.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = hexA(col, 0.55 * a);
    g.beginPath(); g.arc(x, y, p.size * (1 - 0.4 * t), 0, Math.PI * 2); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

/* Background: faint star-dust drifting through the dark, full screen. */
const dcv = document.getElementById('dust'), dg = dcv.getContext('2d');
const dust = Array.from({ length: 70 }, () => ({
  x: Math.random(), y: Math.random(), r: 0.3 + Math.random() * 1.1,
  vx: (Math.random() - 0.5) * 0.004, vy: -0.002 - Math.random() * 0.004,
  tw: Math.random() * 6.28, c: ['#2EE6D6', '#4A7BFF', '#9D5CFF'][Math.floor(Math.random() * 3)]
}));
function sizeDust() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  dcv.width = Math.round(innerWidth * d); dcv.height = Math.round(innerHeight * d);
  dg.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', sizeDust); sizeDust();
function drawDust(now, dt) {
  dg.clearRect(0, 0, innerWidth, innerHeight);
  for (const m of dust) {
    m.x = (m.x + m.vx * dt + 1) % 1; m.y = (m.y + m.vy * dt + 1) % 1;
    const a = 0.12 + 0.18 * (0.5 + 0.5 * Math.sin(now * 0.6 + m.tw));
    dg.fillStyle = hexA(m.c, a);
    dg.beginPath(); dg.arc(m.x * innerWidth, m.y * innerHeight, m.r, 0, Math.PI * 2); dg.fill();
  }
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a.toFixed(3)})`;
}

/* =========================================================================
   FRAME LOOP: breathing core + thud are phase-locked to the audio clock
   ========================================================================= */
function frame(ms) {
  const now = ms / 1000;
  if (playing && Engine.ctx) {
    const ph = Engine.cadencePhase();
    pulse = Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * ph), 4);   // same shape as the heartbeat
    if (lastPhase < 0.25 && ph >= 0.25 && ph - lastPhase < 0.5) buzz(30);   // thud on each beat's peak
    lastPhase = ph;
    const w = Engine.waves(); waveA = w[0]; swell = w[1]; clusterEnv = w[3];
  } else {
    pulse = Math.max(0, pulse - 0.02); swell = Math.max(0, swell - 0.02); waveA = Math.max(0, waveA - 0.02);
  }
  draw(now);
  if (!reduceMotion) drawDust(now, 1 / 60);
  updateReadouts();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =========================================================================
   READOUTS
   ========================================================================= */
const $ = id => document.getElementById(id);
function showHud() {}
function updateReadouts() {}

/* =========================================================================
   GESTURES: one tracked pointer per ring → true multi-touch
   ========================================================================= */
const pointers = new Map();
function polar(e) {
  const b = cv.getBoundingClientRect();
  const x = e.clientX - b.left - b.width / 2, y = e.clientY - b.top - b.height / 2;
  return { angle: Math.atan2(y, x), dist: Math.hypot(x, y) / R };
}
function ringAt(d) { return RINGS.findIndex(r => d >= r.hit[0] && d < r.hit[1]); }

cv.addEventListener('pointerdown', e => {
  const { angle, dist } = polar(e), idx = ringAt(dist);
  if (idx < 0) return;
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { idx, last: angle, x: e.clientX, y: e.clientY, moved: 0, t: performance.now() });
  RINGS[idx].active++; RINGS[idx].grip = angle;
  lastInteract = performance.now() / 1000;
  buzz(4);
});

cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const { angle, dist } = polar(e);
  p.moved = Math.max(p.moved, Math.hypot(e.clientX - p.x, e.clientY - p.y));
  RINGS[p.idx].grip = angle;
  if (dist < 0.06) { p.last = angle; return; }
  let d = angle - p.last;
  if (d > Math.PI) d -= 2 * Math.PI; else if (d <= -Math.PI) d += 2 * Math.PI;
  p.last = angle;
  const nowMs = performance.now(), dt = Math.max(1 / 240, (nowMs - p.t) / 1000); p.t = nowMs;
  rotate(p.idx, d, angle, dt);
});

function end(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId);
  RINGS[p.idx].active = Math.max(0, RINGS[p.idx].active - 1);
  if (!RINGS[p.idx].active) RINGS[p.idx].grip = null;
  if (p.idx === 3 && p.moved < 8) toggle();
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);

function rotate(idx, delta, angle, dt) {
  const r = RINGS[idx], old = r.value;
  r.value = Math.min(1, Math.max(0, old + delta / (2 * Math.PI)));   // one turn = full range
  const eff = (r.value - old) * 2 * Math.PI;
  if (!eff) return;                                                   // pinned at an end-stop
  r.rotation += eff;
  r.dir = eff > 0 ? 1 : -1; r.moved = 1; r.awake = true; stoppedAt = 0;
  r.phase += eff;                                      // the streak follows the finger
  lastInteract = performance.now() / 1000;
  showHud(idx);
  const w = eff / dt;
  emit(r, angle, w);
  if (Engine.send) Engine.send(targets());
  if (idx === 0) {                                                    // detent ticks every 6°
    tickAcc += Math.abs(eff);
    if (tickAcc >= Math.PI / 30) { tickAcc %= Math.PI / 30; const n = performance.now(); if (n - lastTick > 22) { buzz(6); lastTick = n; } }
  } else if (idx === 1) {
    if (performance.now() - lastTick > 70 - 40 * r.value) { buzz(12); lastTick = performance.now(); }
  }
}

function emit(r, angle, w) {
  const speed = Math.abs(w); if (speed < 0.05) return;
  const dir = w >= 0 ? 1 : -1, count = Math.min(5, 1 + Math.floor(speed / 3)), now = performance.now() / 1000;
  const mid = (r.band[0] + r.band[1]) / 2, lo = mid - 0.04;
  for (let i = 0; i < count; i++) {
    particles.push({
      color: r.color, color2: r.color2, angle: angle - dir * i * 0.035 + (Math.random() - 0.5) * 0.04,
      r: lo + Math.random() * 0.08, drift: -dir * Math.min(speed, 12) * 0.12,
      born: now, life: 1.2 + Math.random() * 1.0, size: 1.0 + Math.random() * 1.8
    });
  }
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}

/* =========================================================================
   TRANSPORT + keyboard access
   ========================================================================= */
let wakeLock = null;
async function toggle() {
  if (playing) {
    Engine.stop(); playing = false; stoppedAt = performance.now();
    $('hint').textContent = 'Tap the centre to begin.';
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  } else {
    playing = true; lastPhase = 0; stoppedAt = 0;
    try { await Engine.start(targets()); }
    catch (err) { playing = false; $('hint').textContent = 'Audio could not start. Tap the centre again.'; return; }
    $('hint').textContent = 'Press a ring and turn it.';
    lastInteract = performance.now() / 1000;
    buzz(20);
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
}
cv.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
  const steps = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowRight: [1, 1], ArrowLeft: [1, -1], PageUp: [3, 1], PageDown: [3, -1], Home: [2, 1], End: [2, -1] };
  if (steps[e.key]) { e.preventDefault(); const [i, s] = steps[e.key]; rotate(i, s * 0.05 * 2 * Math.PI, -Math.PI / 2, 0.05); }
});
</script>
</body></html>
