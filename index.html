<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interstate Web Demo</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
  /* Single-look design: Interstate is pure black by identity, in any host theme. */
  :root {
    color-scheme: dark;
    --black: #000000;
    --turq: #2EE6D6;       /* 01 */
    --blue: #4A7BFF;       /* 02 */
    --violet: #9D5CFF;     /* 03 */
    --label: #8A8DB0;      /* lavender grey */
    --faint: #15142A;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; background: var(--black); }
  body { background: radial-gradient(120% 70% at 50% 42%, #0B0920 0%, #05040E 45%, #000 80%) var(--black); }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .app { position: relative; }
  body {
    margin: 0;
    color: var(--label);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding-inline: 16px;
    padding-block: 52px 20px;
    gap: 8px;
  }
  .wordmark {
    margin: 0;
    font-weight: 300; font-size: 13px;
    letter-spacing: 0.6em; padding-left: 0.6em;   /* optically centre the tracked word */
    color: var(--label);
  }
  .stage {
    flex: 1 1 auto; min-height: 0; width: 100%;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; max-width: 100%; transform: translateY(-38px); }   /* ≈ 1 cm up */
  canvas:focus-visible { outline: 1px solid var(--label); outline-offset: 4px; border-radius: 50%; }

  .wordmark, .hint, .hud, .sess, .end { transition: opacity 1.2s ease; }
  body.rest .sess, body.rest .end { opacity: 0; }
  .sess { margin: 6px 0 0; min-height: 14px; font-size: 10px; letter-spacing: 0.22em; padding-left: 0.22em; font-variant-numeric: tabular-nums; }
  .end { margin-top: 10px; background: none; border: 0; color: var(--label); opacity: 0.7; font: 400 10px var(--mono);
         letter-spacing: 0.18em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .end:focus-visible, .intent:focus-visible, .len:focus-visible, .begin:focus-visible { outline: 1px solid var(--label); outline-offset: 3px; }
  /* HOME — choose an intent and a length */
  .home { position: fixed; inset: 0; z-index: 5; box-sizing: border-box; overflow-y: auto;
          display: flex; flex-direction: column; align-items: center; gap: 22px;
          padding-inline: 24px; padding-block: 52px 28px;
          background: radial-gradient(120% 70% at 50% 42%, #0B0920 0%, #05040E 45%, #000 80%) #000;
          transition: opacity 0.9s ease; }
  .home.hidden { opacity: 0; pointer-events: none; }
  .intents { width: 100%; max-width: 360px; display: grid; gap: 4px; margin-top: 8vh; }
  .intent { display: grid; grid-template-columns: 1fr; text-align: left; gap: 3px; cursor: pointer;
            background: none; border: 0; border-left: 1px solid transparent; color: var(--label);
            padding: 12px 14px; font-family: var(--mono); transition: border-color .3s, color .3s, background .3s; }
  .intent .in-name { font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; }
  .intent .in-line { font-size: 10px; letter-spacing: 0.08em; opacity: 0.7; }
  .intent[aria-checked="true"] { color: var(--c); border-left-color: var(--c);
            background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, transparent), transparent 70%); }
  .intent[aria-checked="true"] .in-name { text-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent); }
  .lengths { display: flex; align-items: baseline; gap: 6px; }
  .len { background: none; border: 1px solid transparent; border-radius: 999px; color: var(--label); cursor: pointer;
         font: 500 13px var(--mono); padding: 6px 12px; font-variant-numeric: tabular-nums; }
  .len[aria-checked="true"] { border-color: color-mix(in srgb, var(--label) 60%, transparent); color: #D8DAF0; }
  .len-unit { font-size: 10px; letter-spacing: 0.14em; margin-left: 2px; }
  .begin { margin-top: 6px; background: none; color: #E9E6FF; cursor: pointer; font: 500 12px var(--mono);
           letter-spacing: 0.4em; padding: 14px 34px 14px calc(34px + 0.4em); text-transform: uppercase;
           border: 1px solid color-mix(in srgb, #9D5CFF 55%, transparent); border-radius: 999px;
           box-shadow: 0 0 22px color-mix(in srgb, #9D5CFF 22%, transparent), inset 0 0 14px color-mix(in srgb, #4A7BFF 12%, transparent); }
  .weekly { margin: 4px 0 0; opacity: 0.7;  }
  .weekly, .home-hint { margin: 0; font-size: 10px; letter-spacing: 0.14em; text-align: center; min-height: 14px; }
  .home-hint { margin-top: auto; opacity: 0.6; }
  body.rest .wordmark, body.rest .hint { opacity: 0; }
  .hud { height: 44px; display: grid; justify-items: center; align-content: center; gap: 4px; opacity: 0; }
  .hud.show { opacity: 1; transition: opacity 0.15s ease; }
  .hud-name { font-size: 10px; letter-spacing: 0.28em; padding-left: 0.28em; }
  .hud-val { font-size: 18px; font-weight: 500; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; min-height: 16px; font-size: 10px; letter-spacing: 0.14em; text-align: center; }
  .readouts {
    width: 100%; max-width: 420px;
    display: grid; gap: 12px;
  }
  .row { display: grid; grid-template-columns: 2px 1fr auto; column-gap: 10px; align-items: baseline; }
  .row .bar { align-self: stretch; border-radius: 1px; }
  .row .name { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
  .row .cap { font-size: 9px; letter-spacing: 0.06em; opacity: 0.75; margin-top: 3px; }
  .row .val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .outer .bar { background: var(--turq); box-shadow: 0 0 8px var(--turq); }     .outer .val { color: var(--turq); text-shadow: 0 0 10px rgba(46,230,214,.45); }
  .middle .bar { background: var(--blue); box-shadow: 0 0 8px var(--blue); }     .middle .val { color: var(--blue); text-shadow: 0 0 10px rgba(74,123,255,.45); }
  .core .bar { background: var(--violet); box-shadow: 0 0 8px var(--violet); }   .core .val { color: var(--violet); text-shadow: 0 0 10px rgba(157,92,255,.45); }

  .status {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 9px; letter-spacing: 0.08em; padding-top: 4px;
  }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--label); margin-right: 8px; vertical-align: middle; }
  .dot.on { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .note { font-size: 9px; letter-spacing: 0.04em; opacity: 0.6; text-align: center; max-width: 420px; line-height: 1.5; margin: 0; }
  .err { color: var(--violet); }
</style>
</head><body>
<canvas id="dust" aria-hidden="true"></canvas>

<div class="app">
  <h1 class="wordmark">INTERSTATE</h1>
  <p class="sess" id="sess">&nbsp;</p>

  <div class="stage" id="stage">
    <canvas id="dial" tabindex="0" aria-label="Three concentric knobs. Tap the centre to start or stop. Press a ring and turn it. Arrow keys and Page Up or Down also turn them."></canvas>
  </div>

  <p class="hint" id="hint">Headphones on · v19</p>
  <p class="weekly" id="weekly">&nbsp;</p>
  <button class="end" id="end" hidden>End session</button>
</div>

<script>
/* =========================================================================
   DSP KERNEL: a line-by-line port of Interstate/Audio/DSPKernel.swift.
   Self-contained (no outer references) so its source can be shipped into an
   AudioWorklet via Function.prototype.toString().
   ========================================================================= */
class InterstateKernel {
  // v17 — adds material from Male Wellness / State A "Layered Sub":
  //   DRONE      locked binaural pairs: carrier 128 / 128+beat, sub 64 / 64+beat/2 (always 2:1)
  //   AIR        five textures (deep · body · mid beds, bright + singing-vowel gusts), each with
  //              presence gates and moving pan, plus the Dream Timbre swells and a DRY close breath
  //   WARMTH     even-harmonic saturation (positive half squared) + LeakDC + 7 kHz ceiling
  //   CLUSTER    presence gates: voices drift out and back (floor 15 %)
  // Earlier layers:
  //   HEARTBEAT  \ist_heart (Dream Timbre Mvt V): 55 Hz lub, SinOsc-shaped .pow(4), soft drive
  //   CLUSTER    \ist_cluster: the box ×2, one voice per pitch, 3 drifting oscs each, own swells
  //   AIR        \ist_air (Dream Timbre \dtAirSwell): stochastic dark noise swells
  // Ring 01 = drone beat · 02 = air density/brightness · 03 = cluster presence · 04 (centre) = heartbeat BPM.
  constructor(sr) {
    this.sr = sr;
    this.rng = 0x9E3779B9 >>> 0;
    this.t = { beat: 1.2, air: 0.5, cluster: 0.5, bpm: 45, master: 0, focus: -1, form: 0.5, carrier: 128, tune: 1 };
    this.carrier = 128; this.tune = 1;
    this.form = 0.5;
    this.lg = [1, 1, 1, 1];            // per-layer focus gains: drone, air, cluster, heart
    this.kickReq = false;
    this.beat = 1.2; this.air = 0.5; this.cluster = 0.5; this.bpm = 45; this.master = 0;
    // drone
    this.dL = 0; this.dR = 0; this.dL2 = 0; this.dR2 = 0; this.breathPh = 0.75; this.breath = 0.45;
    // heartbeat
    this.hPh = 0.75; this.lub = 0; this.hWander = this.lfn(0.02, 0.92, 1.08); this.heartHz = 0.75;
    // cluster: your box, one octave up
    const box = [27.5, 43.65, 46.25, 55.0, 65.41, 69.30, 82.41];
    const rankOf = [2, 4, 6, 0, 3, 5, 1];                 // A3 E4 A2 C4 F3 C#4 F#3 enter in that order
    this.voices = box.map((f0, vi) => ({
      rank: rankOf[vi], present: 0,
      f: f0 * 4,                                            // box × 4: A2 F3 F#3 A3 C4 C#4 E4
      wave: { inc: 1 / (18 + this.rand() * 14), ph: this.rand() },
      oscs: [0, 1, 2].map(() => ({
        ph: this.rand(),
        det: this.lfn(0.001 + this.rand() * 0.008, -0.012, 0.012),
        amp: this.lfn(0.003 + this.rand() * 0.009, 0.3, 1.0),
        saw: this.lfn(0.002 + this.rand() * 0.004, 0.08, 0.35),
        pan: this.lfn(0.001 + this.rand() * 0.007, -0.6, 0.6),
        gl: 0, gr: 0, inc: 0, sw: 0
      })),
      env: 0
    }));
    this.bed = [0, 0, 0, 0]; this.bedPkL = new Float64Array(7); this.bedPkR = new Float64Array(7);
    this.dH2 = 0.12; this.dH3 = 0; this.dLev = 1; this.bedA = 0.05; this.bedLev = 0.05; this.dub = 0; this.hLev = 1; this.hH2 = 0.7; this.hH3 = 0.35;
    this.clLpL = 0; this.clLpR = 0; this.clA = 1 - Math.exp(-2 * Math.PI * 2200 / sr);
    // air swells (Dream Timbre)
    this.swells = []; this.nextSwell = 1.5; this.airEnv = 0;
    // DRONE locked pairs
    this.cL = 0; this.cR = 0; this.sL = 0; this.sR = 0;
    // AIR beds: deep (brown→LPF), body (brown→BPF), mid (pink→BPF); each with gate, filter motion, pan motion
    const bed = (lo, hi, rqLo, rqHi, panW, gateRate, gateLo) => ({
      br: 0, pk: new Float64Array(7), f: this.lfn(0.01 + this.rand() * 0.02, lo, hi),
      rq: this.lfn(0.02 + this.rand() * 0.02, rqLo, rqHi), bq: this.bqNew(), bq2: this.bqNew(),
      panSlow: this.lfn(0.006 + this.rand() * 0.01, -panW, panW), panFast: this.lfn(0.07 + this.rand() * 0.05, -0.15, 0.15),
      gate: this.lfn(gateRate, gateLo, 1.3), amp: this.lfn(0.02 + this.rand() * 0.02, 0.6, 1), gl: 0, gr: 0 });
    this.beds = [bed(80, 400, 0, 0, 0.6, 0.0031, -0.5),     // deep  (LPF)
                 bed(100, 500, 0.25, 0.6, 0.6, 0.0043, -0.8), // body  (BPF)
                 bed(250, 1000, 0.2, 0.5, 0.8, 0.0050, -0.8)]; // mid   (BPF)
    // AIR gusts: bright (HPF) and singing (vowel formants)
    this.gusts = []; this.nextBright = 4; this.nextSing = 8;
    // breath (dry, close)
    this.breathV = { ph: 3, len: 1, stage: 3, pk: new Float64Array(7), bq: this.bqNew(), pan: 0, bright: 1, t: 0, inT: 3, turn: 0.8, outT: 6, rest: 2 };
    // cluster presence gates
    for (const v of this.voices) v.gate = this.lfn(0.004 + this.rand() * 0.004, -0.5, 1.4);
    // warmth / master chain states
    this.wm = { dcxL: 0, dcyL: 0, dcxR: 0, dcyR: 0, lpL: 0, lpR: 0 };
    this.ceilA = 1 - Math.exp(-2 * Math.PI * 7000 / sr);
    this.env = new Float64Array(4);   // telemetry: drone breath, air, heart, cluster
  }
  rand() {
    let x = this.rng; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; this.rng = x;
    return x / 4294967296;
  }
  white() { return this.rand() * 2 - 1; }
  lfn(rate, lo, hi) { return { a: lo + (hi - lo) * Math.random(), b: lo + (hi - lo) * Math.random(), t: 0, rate, lo, hi, v: 0 }; }
  stepLfn(o, dtBlock) {        // LFNoise1-style: linear ramps between random values
    o.t += o.rate * dtBlock;
    while (o.t >= 1) { o.t -= 1; o.a = o.b; o.b = o.lo + (o.hi - o.lo) * this.rand(); }
    o.v = o.a + (o.b - o.a) * o.t; return o.v;
  }
  bqNew() { return { b0: 0, b1: 0, b2: 0, a1: 0, a2: 0, z1: 0, z2: 0 }; }
  bqSet(q, type, f, Q) {                 // RBJ biquad: 'lp' | 'hp' | 'bp' (constant 0 dB peak)
    const w0 = 2 * Math.PI * Math.min(Math.max(f, 20), this.sr * 0.45) / this.sr;
    const c = Math.cos(w0), al = Math.sin(w0) / (2 * Q), a0 = 1 + al;
    if (type === 'lp') { q.b0 = (1 - c) / 2 / a0; q.b1 = (1 - c) / a0; q.b2 = q.b0; }
    else if (type === 'hp') { q.b0 = (1 + c) / 2 / a0; q.b1 = -(1 + c) / a0; q.b2 = q.b0; }
    else { q.b0 = al / a0; q.b1 = 0; q.b2 = -al / a0; }
    q.a1 = -2 * c / a0; q.a2 = (1 - al) / a0;
  }
  bq(q, x) { const y = q.b0 * x + q.z1; q.z1 = q.b1 * x - q.a1 * y + q.z2; q.z2 = q.b2 * x - q.a2 * y; return y; }
  pinkNext(p, w) {
    p[0] = 0.99886 * p[0] + w * 0.0555179; p[1] = 0.99332 * p[1] + w * 0.0750759; p[2] = 0.969 * p[2] + w * 0.153852;
    p[3] = 0.8665 * p[3] + w * 0.3104856; p[4] = 0.55 * p[4] + w * 0.5329522; p[5] = -0.7616 * p[5] - w * 0.016898;
    const o = (p[0] + p[1] + p[2] + p[3] + p[4] + p[5] + p[6] + w * 0.5362) * 0.11; p[6] = w * 0.115926; return o;
  }
  gateShape(x) { const g = Math.min(1, Math.max(0, x)); return g * g * (3 - 2 * g); }   // smooth, reaches true 0
  spawnGust(kind) {
    const vowels = [[300, 870], [400, 800], [500, 1000], [700, 1220]];     // oo oh uh ah
    const bright = kind === 0, d0 = Math.pow(this.rand(), 2), d1 = Math.pow(this.rand(), 2);   // mostly far
    const g = { kind, t: 0, dur: bright ? 3 + this.rand() * 11 : 8 + this.rand() * 26,
      p0: this.rand() * 1.8 - 0.9, p1: this.rand() * 1.8 - 0.9, d0, d1, pk: new Float64Array(7),
      f: bright ? 900 + this.rand() * 3100 : 0, v: vowels[Math.floor(this.rand() * 4)],
      rq: 0.03 + this.rand() * 0.09, b1: this.bqNew(), b2: this.bqNew(), lp: 0, gl: 0, gr: 0, env: 0 };
    if (bright) this.bqSet(g.b1, 'hp', g.f, 0.7);
    else { this.bqSet(g.b1, 'bp', g.v[0], 1 / g.rq); this.bqSet(g.b2, 'bp', g.v[1], 1 / g.rq); }
    this.gusts.push(g);
  }
  setTargets(o) { if (o.kick) { this.kickReq = true; return; } Object.assign(this.t, o); }
  spawnSwell(fast) {
    const air = this.air, dark = 1 - 0.45 * air;           // more air = a little brighter
    const pick = this.rand();
    let ch;                                                // 0 = A, 1 = B, 2 = C (your characters)
    if (this.rand() < dark) ch = pick > 0.5 ? 2 : 0;
    else ch = pick > 0.6 ? 2 : (pick > 0.32 ? 1 : 0);
    this.swells.push({
      ch, t: 0, att: fast ? 1.5 + this.rand() * 1.5 : 6 + this.rand() * 8, rel: 8 + this.rand() * 10,
      reg: 0.55 + this.rand() * (1.8 - 0.8 * dark - 0.55),
      pan: this.rand() * 1.6 - 0.8, drift: this.lfn(0.03 + this.rand() * 0.05, -0.25, 0.25),
      br: 0, pk: new Float64Array(7), lp1: [0, 0], lp2: [0, 0], hp: [0, 0], amp: 0.45 + 0.4 * air
    });
  }
  render(L, R, SL, SR, n) {
    const TP = 2 * Math.PI, inv = 1 / this.sr, dtB = n * inv, t = this.t;
    // ---- control rate (once per block) ----
    const k = (tau) => 1 - Math.exp(-dtB / tau);
    this.beat += (t.beat - this.beat) * k(0.5);
    this.air += (t.air - this.air) * k(0.5);
    this.cluster += (t.cluster - this.cluster) * k(0.8);
    this.bpm += (t.bpm - this.bpm) * k(3);
    this.carrier += (t.carrier - this.carrier) * k(2); this.tune += (t.tune - this.tune) * k(2);   // retuning glides
    // Each ring is a macro: several parameters move together and glide, so any turn is audible.
    // Session arc (form 0…1, 0.5 = neutral): opens the air and the cluster toward the peak
    this.form += (t.form - this.form) * k(4);
    const cl01 = x => Math.min(1, Math.max(0, x));
    const vD = (this.beat - 1) / 7.5, vH = (this.bpm - 30) / 30;
    const vA = cl01(this.air * (0.55 + 0.9 * this.form) + 0.12 * (this.form - 0.5));
    const vC = cl01(this.cluster * (0.7 + 0.6 * this.form));
    // DRONE: beat speed + brighter partials + more body
    this.dH2 = 0.10 + 0.40 * vD; this.dH3 = 0.30 * vD * vD; this.dLev = 0.75 + 0.65 * vD;
    // AIR: the ring travels through the five textures — dark/close (deep, body) at the
    // bottom, open/bright (mid beds, bright + singing gusts) at the top.
    const bedW = [1.15 - 0.75 * vA, 0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, vA * 1.2)), 0.15 + 1.0 * vA];
    for (let j = 0; j < 3; j++) {
      const q = this.beds[j];
      const f = this.stepLfn(q.f, dtB) * (0.8 + 0.5 * vA), rq = this.stepLfn(q.rq, dtB);
      if (j === 0) this.bqSet(q.bq, 'lp', f, 0.7); else { this.bqSet(q.bq, 'bp', f, 1 / rq); this.bqSet(q.bq2, 'lp', 7000, 0.7); }
      const gate = Math.max(0.12, this.gateShape(this.stepLfn(q.gate, dtB)));   // beds thin, never vanish entirely
      const lev = bedW[j] * gate * this.stepLfn(q.amp, dtB) * [0.9, 2.6, 2.4][j];
      const pn = (Math.max(-1, Math.min(1, this.stepLfn(q.panSlow, dtB) + this.stepLfn(q.panFast, dtB))) + 1) * 0.25 * Math.PI;
      q.gl = Math.cos(pn) * lev; q.gr = Math.sin(pn) * lev;
    }
    // gusts: density follows the ring (bright from ~20 %, singing from ~35 %)
    this.nextBright -= dtB; this.nextSing -= dtB;
    const bRate = Math.max(0, vA - 0.2) * 0.2, sRate = Math.max(0, vA - 0.35) * 0.12;   // gusts per second
    if (this.nextBright <= 0) { if (bRate > 0 && this.gusts.length < 6) this.spawnGust(0); this.nextBright = bRate > 0 ? (0.4 + 1.2 * this.rand()) / bRate : 2; }
    if (this.nextSing <= 0)   { if (sRate > 0 && this.gusts.length < 6) this.spawnGust(1); this.nextSing = sRate > 0 ? (0.4 + 1.2 * this.rand()) / sRate : 3; }
    let gustSum = 0;
    for (let j = this.gusts.length - 1; j >= 0; j--) {
      const g = this.gusts[j]; g.t += dtB;
      if (g.t >= g.dur) { this.gusts.splice(j, 1); continue; }
      const x = g.t / g.dur; g.env = Math.sin(Math.PI * x);                 // Env.sine
      const depth = g.d0 + (g.d1 - g.d0) * x, pan = g.p0 + (g.p1 - g.p0) * x;   // approaches / withdraws while sweeping
      g.lp = 1 - Math.exp(-TP * Math.min(7000, 2100 + depth * 10600) * inv);    // closer = brighter
      const lev = g.env * (0.25 + 0.75 * depth) * (g.kind === 0 ? 0.6 * 2.2 : 1.6 * 3.2);
      const pn = (pan + 1) * 0.25 * Math.PI; g.gl = Math.cos(pn) * lev; g.gr = Math.sin(pn) * lev;
      gustSum += g.env * (0.4 + 0.6 * depth);
    }
    // breath: dry and close — 3–4.5 s in (brighter), 0.8 s turn, 5–8 s out, 1–3 s rest
    const B2 = this.breathV; B2.t += dtB;
    const bTotal = B2.inT + B2.turn + B2.outT + B2.rest;

        class InterstateProcessor extends AudioWorkletProcessor {
          constructor() { super(); this.k = new InterstateKernel(sampleRate); this.n = 0;
            this.port.onmessage = e => this.k.setTargets(e.data); }
          process(inputs, outputs) {

    const off = a / r.arms * Math.PI * 2 + ang;

}
